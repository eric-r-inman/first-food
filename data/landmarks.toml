# Landmarks.  A landmark (notable map feature, wonder, ruin, …) is placed as a
# layer over the terrain.  It reuses the terrain shape: a `key` stored per tile,
# a display `glyph` and `color`, and optional `props`.  Placeholders; rename and
# retheme them in the landmark editor.

[[landmark]]
id = "Landmark A"
key = "i"
glyph = "✦"
color = "bright_white"

[[landmark]]
id = "Landmark B"
key = "j"
glyph = "✪"
color = "bright_yellow"

[[landmark]]
id = "Landmark C"
key = "k"
glyph = "⚑"
color = "bright_red"

[[landmark]]
id = "Landmark D"
key = "l"
glyph = "⌖"
color = "bright_cyan"

[[landmark]]
id = "Landmark E"
key = "n"
glyph = "☖"
color = "bright_green"
