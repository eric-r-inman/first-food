# Resources.  A resource is placed as a layer over the terrain.  It reuses the
# terrain shape: a `key` stored per tile in the resource layer, plus a display
# `glyph` and `color`, and optional `props`.  These are placeholders; rename and
# retheme them freely in the resource editor.

[[resource]]
id = "Resource A"
key = "A"
glyph = "♦"
color = "bright_red"

