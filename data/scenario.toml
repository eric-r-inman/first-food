# Starting settlement.  This is the first "skin": a Pacific Northwest tribe in
# roughly the Holocene.  Only the values are theme-specific; the engine is not.

settlement_name = "Cedar Hollow"

# The starting map: a grassland with a river running through it.  `background`
# and `river` name terrain ids from terrain.toml.
[map]
width = 50
height = 18
background = "grass"
river = "water"

[[individual]]
name = "Tahoma"
archetype = "forager"

[[individual]]
name = "Salish"
archetype = "fisher"

[[individual]]
name = "Kwina"
archetype = "forager"
